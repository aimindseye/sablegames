name: SonarCloud

# CI-based SonarQube Cloud analysis. It runs once the SONAR_TOKEN secret is set (create the
# project aimindseye_sablegames in SonarQube Cloud and turn its Automatic Analysis off first).
# Documentation-only changes skip the analysis (security.yml still scans them).
on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    # Pull requests from forks get no secrets, so they can't be analyzed here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: SonarQube Cloud is configured
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -n "$SONAR_TOKEN" ]]; then echo "set=yes" >> "$GITHUB_OUTPUT"; else
            echo "::notice::SONAR_TOKEN is not set; skipping SonarQube Cloud analysis"; fi
      - name: Checkout repository
        if: steps.token.outputs.set == 'yes'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history for blame and new-code detection.
          fetch-depth: 0
      - name: Empty binaries folder for the Java analyzer
        if: steps.token.outputs.set == 'yes'
        run: mkdir -p .sonar-empty
      - name: Run SonarQube Cloud analysis
        if: steps.token.outputs.set == 'yes'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
