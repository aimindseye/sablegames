name: Release

# On a v* tag: build every app's release APK signed with the Sable Games key and publish a
# GitHub release with the APKs and SHA256SUMS.txt (docs/RELEASING.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Signing key is configured
        env:
          KEYSTORE_BASE64: ${{ secrets.SABLEGAMES_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::SABLEGAMES_KEYSTORE_BASE64 is not set; see docs/RELEASING.md"
            exit 1
          fi
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Build signed APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.SABLEGAMES_KEYSTORE_BASE64 }}
          SABLEGAMES_KEYSTORE_PASSWORD: ${{ secrets.SABLEGAMES_KEYSTORE_PASSWORD }}
          SABLEGAMES_KEY_ALIAS: ${{ secrets.SABLEGAMES_KEY_ALIAS }}
          SABLEGAMES_KEY_PASSWORD: ${{ secrets.SABLEGAMES_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export SABLEGAMES_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$SABLEGAMES_KEYSTORE_FILE"
          ./gradlew --no-daemon --console=plain assembleRelease
          rm -f "$SABLEGAMES_KEYSTORE_FILE"
      - name: Check and collect the APKs
        run: |
          set -euo pipefail
          bash scripts/check-apks.sh games/build/outputs/apk
          mkdir -p out
          for apk in games/build/outputs/apk/*/release/*-release.apk; do
            flavor="$(basename "$(dirname "$(dirname "$apk")")")"
            cp "$apk" "out/sable-$flavor-${GITHUB_REF_NAME}.apk"
          done
          (cd out && sha256sum ./*.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "Sable Games $GITHUB_REF_NAME" --generate-notes
